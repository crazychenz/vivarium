[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thirdparty-vivarium"
description = "Agent Sandboxing"
# Note: No idea the real version required at this time.
requires-python = ">=3.9"

dependencies = [
    "argcomplete",
    "pyyaml",
    "pycdlib",
    #"libvirt-python",
    "dissect.target",
    "dissect.extfs",
    "dissect.fat",
    "mcp>=1.9,<2",
    "asyncssh>=2.14",
    "thirdparty-qemu",
    "thirdparty-dockerfile"
]

# Requires PEP 621 (setuptools>=61)
dynamic = ["version"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[project.scripts]
vivarium = "thirdparty.vivarium.cli:main"
viv = "thirdparty.vivarium.cli:main"

[project.entry-points."thirdparty_vivarium_operators"]
# Register agent (agentic sandbox) as an vivarium operator
agent = "thirdparty.vivarium.operator.vivarium.agent:register_operator_agent"

[project.entry-points."thirdparty_izba_drivers"]
# Register crt (container runtime) as an izba driver
#vivarium_agentvm = "thirdparty.vivarium.izba.driver.agentvm:register_driver_agentvm"
#vivarium_enclosurevm = "thirdparty.vivarium.izba.driver.enclosurevm:register_driver_enclosurevm"