[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thirdparty-vivarium"
description = "Agent Sandboxing"
# Note: No idea the real version required at this time.
requires-python = ">=3.9"

dependencies = [
    "argcomplete",
    "pyyaml",
    "pycdlib",
    #"libvirt-python",
    "dissect.target",
    "dissect.extfs",
    "dissect.fat",
    "thirdparty-qemu",
    "thirdparty-dockerfile"
]

# Requires PEP 621 (setuptools>=61)
dynamic = ["version"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[project.scripts]
vivarium = "thirdparty.vivarium.cli:main"

